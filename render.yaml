# Render Blueprint — Carmen WMS (Laravel 13 + PostgreSQL)
# En Render: New + → Blueprint → elegir este repositorio → Apply.
services:
  - type: web
    name: carmen-wms
    runtime: docker
    rootDir: api
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Carmen WMS
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_TIMEZONE
        value: America/La_Paz
      - key: APP_LOCALE
        value: es
      - key: WMS_VERSION
        value: 0.3.0
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: carmen-wms-db
          property: connectionString

databases:
  - name: carmen-wms-db
    databaseName: carmen_wms
    user: carmen
    plan: free
