# Publica la PWA (modo demostración) y el prototipo de escritorio en GitHub Pages.
#   /            → PWA del colector
#   /prototipo/  → prototipo navegable escritorio + colector (docs/prototipo)
# Activar en Settings → Pages → Source: GitHub Actions.
name: Publicar PWA en GitHub Pages

on:
  push:
    branches: [main]
    paths: ['pwa/**', 'docs/prototipo/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - run: npm ci
      # base = /<repo>/ para que las rutas funcionen en un subdirectorio de Pages
      - run: VITE_BASE="/${GITHUB_REPOSITORY#*/}/" npm run build
      # el prototipo de escritorio se sirve en /prototipo/
      - run: mkdir -p dist/prototipo && cp -r ../docs/prototipo/. dist/prototipo/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pwa/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
